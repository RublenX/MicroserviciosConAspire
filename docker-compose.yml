services:
  postgres:
    image: postgres:18.4
    container_name: postgres-common
    # restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # POSTGRES_DB: servicioclientesdb

    ports:
      - "5432:5432"

    volumes:
      - postgres-common-data:/var/lib/postgresql

    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U postgres -d servicioclientesdb"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 6
    #   start_period: 20s

volumes:
  postgres-common-data: